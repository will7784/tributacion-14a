<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tributación 14A{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-2 d-none d-md-block sidebar">
                <div class="text-center mb-3">
                    <h5><i class="bi bi-building"></i> 14A SII</h5>
                </div>
                <div class="px-3 mb-3" id="sidebar-empresa">
                    <span class="text-white-50">Sin empresa seleccionada</span>
                </div>
                <ul class="nav flex-column px-2">
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                            <i class="bi bi-house"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'importar' %}active{% endif %}" href="{{ url_for('importar') }}">
                            <i class="bi bi-upload"></i> Importar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'plan_base_page' %}active{% endif %}" href="{{ url_for('plan_base_page') }}">
                            <i class="bi bi-list-ol"></i> Plan Base
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'homologacion' %}active{% endif %}" href="{{ url_for('homologacion') }}">
                            <i class="bi bi-link-45deg"></i> Homologación
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'clasificacion' %}active{% endif %}" href="{{ url_for('clasificacion') }}">
                            <i class="bi bi-diagram-3"></i> Clasificación
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'comprobantes' %}active{% endif %}" href="{{ url_for('comprobantes') }}">
                            <i class="bi bi-journal-text"></i> Comprobantes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'balance' %}active{% endif %}" href="{{ url_for('balance') }}">
                            <i class="bi bi-table"></i> Balance
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'ajustes' %}active{% endif %}" href="{{ url_for('ajustes') }}">
                            <i class="bi bi-sliders"></i> Ajustes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dj1847' %}active{% endif %}" href="{{ url_for('dj1847') }}">
                            <i class="bi bi-file-earmark-text"></i> DJ 1847
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.endpoint == 'dj1926' %}active{% endif %}" href="{{ url_for('dj1926') }}">
                            <i class="bi bi-file-earmark-bar-graph"></i> DJ 1926
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Main content -->
            <main class="col-md-10 ms-sm-auto main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
